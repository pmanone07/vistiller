
workflows:
  korpsfix-ios:
    name: KorpsFix iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Prepare Capacitor assets
        script: |
          mkdir -p capacitor-web
          echo '<!doctype html><html><body>KorpsFix</body></html>' > capacitor-web/index.html

      - name: Sync iOS project
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          if [ -f Podfile ]; then pod install; fi

      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
